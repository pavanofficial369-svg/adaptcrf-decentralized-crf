<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdaptCRF — Adaptive Decentralized CRF Binder | Study DCT-HF-501</title>
<style>
  :root{
    --bg:#F5F7F8; --surface:#FFFFFF; --surface-alt:#EEF3F4;
    --ink:#16232B; --ink-soft:#57666E; --line:#DEE5E8;
    --teal:#1F8478; --teal-soft:#E1F1EE;
    --coral:#D6493B; --coral-soft:#FBE7E4;
    --sans: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;}

  .topbar{background:var(--ink);color:#fff;border-bottom:1px solid #0d1519;}
  .topbar-inner{max-width:1240px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .pulse-mark{width:50px;height:28px;flex-shrink:0;}
  .pulse-path{fill:none;stroke:var(--coral);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 3.2s ease-in-out infinite;}
  @keyframes draw{0%{stroke-dashoffset:220;}45%{stroke-dashoffset:0;}100%{stroke-dashoffset:-220;}}
  .brand-name{font-weight:700;font-size:16px;}
  .brand-tag{font-size:11.5px;color:#AEBAC0;}
  .study-meta{display:flex;gap:18px;font-family:var(--mono);font-size:12px;flex-wrap:wrap;}
  .study-meta .label{display:block;color:#8C9BA2;font-size:10px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px;}
  .study-meta .value{color:#fff;}
  .study-meta select{background:#22323B;color:#fff;border:1px solid #37474F;border-radius:5px;padding:4px 6px;font-family:var(--mono);font-size:12px;}
  .summary-strip{background:#0F1A20;color:#C7D2D6;font-family:var(--mono);font-size:11.5px;padding:6px 22px;text-align:right;}
  .summary-strip b{color:#fff;}
  .summary-strip .q-count{color:#FF8A76;}

  .app-body{max-width:1240px;margin:0 auto;display:flex;align-items:flex-start;}

  /* ---------- Sidebar ---------- */
  .sidebar{width:270px;flex-shrink:0;position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:18px 10px 90px;border-right:1px solid var(--line);}
  .folder-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);padding:14px 10px 6px;}
  .nav-link{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:7px;font-size:12.8px;color:var(--ink);cursor:pointer;font-family:var(--sans);}
  .nav-link:hover{background:var(--surface-alt);}
  .nav-link.active{background:var(--ink);color:#fff;}
  .nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#C7D0D4;}
  .dot-teal{background:var(--teal);}
  .dot-coral{background:var(--coral);}
  .dot-grey{background:#C7D0D4;}

  /* ---------- Main content ---------- */
  .content{flex:1;min-width:0;padding:22px 26px 110px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px 26px;}
  .card-head{margin-bottom:18px;}
  .card-eyebrow{font-family:var(--mono);font-size:11px;color:var(--teal);background:var(--teal-soft);display:inline-block;padding:3px 8px;border-radius:5px;margin-bottom:8px;}
  .card-head h2{margin:0 0 6px;font-size:19px;}
  .card-sub{margin:0;font-size:13.5px;color:var(--ink-soft);max-width:640px;}
  .form-section{display:none;}
  .form-section.active{display:block;}

  .sync-btn, .save-btn, .sign-btn, .rand-btn{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
  .sync-btn:hover, .save-btn:hover, .sign-btn:hover, .rand-btn:hover{background:#186f65;}
  .rand-btn:disabled{background:#C7D0D4;cursor:not-allowed;}
  .sync-btn:focus-visible,.save-btn:focus-visible,.sign-btn:focus-visible,.pill:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;}
  .field-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
  .field-item{display:flex;flex-direction:column;gap:5px;}
  .field-item label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field-item input,.field-item select,.field-item textarea{border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:13.5px;font-family:var(--sans);}
  .field-item textarea{resize:vertical;min-height:56px;}
  .field-item.query input,.field-item.query select{border-color:var(--coral);background:var(--coral-soft);}
  .inline-note{grid-column:1/-1;background:var(--coral-soft);border:1px solid #F0C2BB;color:#8C2E23;border-radius:6px;padding:8px 10px;font-size:12px;display:none;}
  .inline-note.show{display:block;}
  .inline-note.info{background:var(--teal-soft);border-color:#B7DFD9;color:#155850;}

  .vitals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
  .vital{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface-alt);}
  .vital-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .vital-label{font-size:12.5px;font-weight:600;}
  .tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px;}
  .tag-device{background:var(--teal-soft);color:var(--teal);}
  .tag-manual{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);}
  .vital input{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:14px;font-family:var(--mono);background:#fff;color:var(--ink);}
  .vital-unit{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .query-flag{display:none;margin-top:8px;background:var(--coral-soft);border:1px solid #F0C2BB;color:#8C2E23;border-radius:6px;padding:6px 8px;font-size:11.5px;line-height:1.35;}
  .vital.has-query input{border-color:var(--coral);}
  .vital.has-query .query-flag{display:block;}

  .field-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:6px 0;}
  .field-row label{font-size:14px;font-weight:600;max-width:580px;}
  .pill-toggle{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-shrink:0;}
  .pill{background:#fff;border:none;padding:7px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:var(--sans);}
  .pill+.pill{border-left:1px solid var(--line);}
  .pill.active{background:var(--ink);color:#fff;}
  .reveal{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .reveal.open{max-height:1400px;margin-top:14px;}

  .symptom-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .symptom-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:6px 13px 6px 10px;font-size:13px;cursor:pointer;background:#fff;}
  .symptom-chip input{margin:0;}
  .symptom-chip.checked{border-color:var(--teal);background:var(--teal-soft);color:#155850;}
  .severity-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px;background:var(--surface-alt);}
  .severity-item h4{margin:0 0 8px;font-size:13px;}
  .severity-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .severity-row label{font-size:12.5px;display:flex;align-items:center;gap:5px;font-weight:500;}

  .elig-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line);}
  .elig-row:last-child{border-bottom:none;}
  .elig-row input{margin-top:3px;}

  .table-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .dyn-head,.dyn-row{display:grid;gap:8px;padding:9px 12px;align-items:center;}
  .dyn-head{background:var(--surface-alt);font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.4px;}
  .dyn-row{border-top:1px solid var(--line);}
  .dyn-row input,.dyn-row select{border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12.5px;width:100%;}
  .dyn-row.query input{border-color:var(--coral);}
  .remove-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:17px;line-height:1;}
  .remove-btn:hover{color:var(--coral);}
  .add-row-btn{margin-top:10px;background:none;border:1px dashed var(--line);border-radius:7px;padding:8px 14px;font-size:12.5px;color:var(--teal);cursor:pointer;font-weight:600;}

  .epro-q{margin-bottom:18px;}
  .epro-q:last-child{margin-bottom:0;}
  .epro-q p{font-size:13.5px;font-weight:600;margin:0 0 8px;}
  .qscale{display:flex;gap:6px;flex-wrap:wrap;}
  .qscale label{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:5px;background:#fff;}
  .qscale label.sel{border-color:var(--teal);background:var(--teal-soft);color:#155850;}
  .qscale input{margin:0;}
  .epro-score{margin-top:14px;font-family:var(--mono);font-size:13px;color:var(--teal);font-weight:700;border-top:1px solid var(--line);padding-top:12px;}

  .derived-list{display:flex;flex-direction:column;gap:8px;}
  .derived-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:7px;padding:9px 12px;font-size:13px;background:var(--surface-alt);}
  .derived-badge{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:4px;}
  .badge-done{background:var(--teal-soft);color:var(--teal);}
  .badge-pending{background:#EEE;color:var(--ink-soft);}

  .rand-box{border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center;}
  .rand-result{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--teal);margin-top:10px;display:none;}
  .rand-result.show{display:block;}

  .legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .query-panel-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;border-top:1px solid var(--line);padding-top:12px;}
  #queryCount{font-family:var(--mono);color:var(--coral);}
  .query-list{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
  .query-row{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;background:var(--coral-soft);border:1px solid #F0C2BB;border-radius:7px;padding:8px 10px;color:#7A281F;}
  .query-row .qtag{font-family:var(--mono);font-size:10px;background:#fff;border-radius:4px;padding:2px 6px;flex-shrink:0;}
  .empty-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin-top:8px;}

  .audit-toggle{background:none;border:1px solid var(--line);border-radius:7px;padding:7px 14px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;margin-top:14px;}
  .audit-list{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:12px;display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto;background:var(--surface-alt);border-radius:7px;padding:10px 12px;}
  .sig-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:16px;}
  .sig-field{display:flex;flex-direction:column;gap:5px;}
  .sig-field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .sig-field input,.sig-field select{border:1px solid var(--line);border-radius:6px;padding:8px 9px;font-size:13.5px;min-width:180px;}
  .sign-banner{margin-top:14px;border-radius:7px;padding:10px 12px;font-size:12.5px;display:none;}
  .sign-banner.ok{display:block;background:var(--teal-soft);color:#155850;}
  .sign-banner.blocked{display:block;background:var(--coral-soft);color:#7A281F;}

  .footer{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;}
  .footer-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;width:100%;}
  .footer-note{font-size:12.5px;color:var(--ink-soft);font-family:var(--mono);}

  @media (max-width:900px){
    .app-body{flex-direction:column;}
    .sidebar{width:100%;position:static;max-height:none;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:10px;border-right:none;border-bottom:1px solid var(--line);}
    .folder-title{display:none;}
    .nav-link{white-space:nowrap;}
    .field-grid,.field-grid.cols3{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="pulse-mark" viewBox="0 0 140 60" xmlns="http://www.w3.org/2000/svg">
        <path class="pulse-path" d="M0 32 L28 32 L36 12 L46 50 L56 24 L64 32 L140 32"/>
      </svg>
      <div>
        <div class="brand-name">AdaptCRF</div>
        <div class="brand-tag">Adaptive Decentralized CRF Binder</div>
      </div>
    </div>
    <div class="study-meta">
      <div><span class="label">Study</span><span class="value">DCT-HF-501</span></div>
      <div><span class="label">Subject</span><span class="value">HF-0142</span></div>
      <div><span class="label">Visit</span>
        <select id="visitSelect">
          <option>Screening</option>
          <option>Baseline</option>
          <option selected>Week 4 — Remote</option>
          <option>Week 8 — Remote</option>
          <option>Week 12 — Site</option>
        </select>
      </div>
    </div>
  </div>
  <div class="summary-strip" id="summaryBar">0/32 forms started · 0 open queries</div>
</header>

<div class="app-body">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="card">
      <div id="formsRoot"></div>
    </div>
  </main>
</div>

<footer class="footer">
  <div class="footer-inner">
    <button class="save-btn" id="saveBtn">Save form</button>
    <div class="footer-note" id="footerNote">Draft — navigate forms from the left panel</div>
  </div>
</footer>

<script>
/* ============================================================
   STATE
   ============================================================ */
let openQueries = {};     // qid -> {message, formId}
let auditLog = [];
function logEvent(text){
  const stamp = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  auditLog.unshift(`${stamp} — ${text}`);
  const el = document.getElementById('auditList');
  if(el) el.innerHTML = auditLog.map(a=>`<div>${a}</div>`).join('') || '<div>No events yet.</div>';
}

/* ============================================================
   FORM REGISTRY — defines the 32-form / 5-folder structure
   ============================================================ */
const FOLDERS = [
  { title:'Screening & Enrollment', forms:['f1','f2','f3','f4','f5','f6','f7','f8','f9','f10','f11'] },
  { title:'Baseline & Diagnostics', forms:['f12','f13','f14','f15','f16'] },
  { title:'Treatment & Visit Forms', forms:['f17','f18','f19','f20','f21','f22'] },
  { title:'Safety', forms:['f23','f24','f25','f26','f27'] },
  { title:'Study Closeout', forms:['f28','f29','f30','f31','f32'] },
];
const FORM_TITLES = {
  f1:'1. Study Information', f2:'2. Informed Consent', f3:'3. Subject Registration',
  f4:'4. Demographics', f5:'5. Inclusion Criteria', f6:'6. Exclusion Criteria',
  f7:'7. Medical History', f8:'8. Surgical History', f9:'9. Family History',
  f10:'10. Social History', f11:'15. Pregnancy Test',
  f12:'11. Physical Examination', f13:'12. Vital Signs', f14:'13. Laboratory Tests',
  f15:'14. ECG / Diagnostic Tests', f16:'16. Randomization / Allocation',
  f17:'17. Study Treatment Administration', f18:'18. Drug Accountability',
  f19:'19. Concomitant Medications', f20:'20. Study Procedures',
  f21:'21. Visit Assessments', f22:'22. Efficacy Assessments',
  f23:'23. Safety Assessments', f24:'24. Adverse Events', f25:'25. Serious Adverse Events',
  f26:'26. Protocol Deviations', f27:'27. Missed / Unscheduled Visit',
  f28:'28. Withdrawal / Discontinuation', f29:'29. End of Treatment',
  f30:'30. Follow-up Visit', f31:'31. End of Study', f32:'32. Investigator Sign-off',
};

/* ---------- Sidebar ---------- */
const sidebar = document.getElementById('sidebar');
FOLDERS.forEach(folder=>{
  const heading = document.createElement('div');
  heading.className='folder-title'; heading.textContent=folder.title;
  sidebar.appendChild(heading);
  folder.forms.forEach(fid=>{
    const btn = document.createElement('button');
    btn.className='nav-link'; btn.dataset.target='form-'+fid;
    btn.innerHTML = `<span class="nav-dot dot-grey" data-target="form-${fid}"></span>${FORM_TITLES[fid]}`;
    btn.addEventListener('click', ()=>showForm(fid));
    sidebar.appendChild(btn);
  });
});
function showForm(fid){
  document.querySelectorAll('.form-section').forEach(s=>s.classList.remove('active'));
  document.getElementById('form-'+fid).classList.add('active');
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active', l.dataset.target==='form-'+fid));
  document.querySelector('main.content').scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Generic section shell builder ---------- */
const root = document.getElementById('formsRoot');
function makeSection(fid, eyebrow, subtitle){
  const sec = document.createElement('section');
  sec.className='form-section'; sec.id='form-'+fid;
  sec.innerHTML = `
    <div class="card-head">
      <div class="card-eyebrow">${eyebrow}</div>
      <h2>${FORM_TITLES[fid].replace(/^\d+\.\s*/,'')}</h2>
      <p class="card-sub">${subtitle}</p>
    </div>
    <div class="form-body" id="body-${fid}"></div>
  `;
  root.appendChild(sec);
  return document.getElementById('body-'+fid);
}

/* ---------- Generic field-grid renderer for simple capture forms ---------- */
function renderFieldGrid(container, fields, cols3){
  const grid = document.createElement('div');
  grid.className = 'field-grid' + (cols3?' cols3':'');
  fields.forEach(f=>{
    const item = document.createElement('div');
    item.className='field-item'; item.id='item-'+f.id;
    let control='';
    if(f.type==='select'){
      control = `<select id="${f.id}"><option value="">Select…</option>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;
    } else if(f.type==='textarea'){
      control = `<textarea id="${f.id}" placeholder="${f.placeholder||''}"></textarea>`;
    } else {
      control = `<input type="${f.type}" id="${f.id}" placeholder="${f.placeholder||''}" ${f.readonly?'readonly':''}>`;
    }
    item.innerHTML = `<label>${f.label}</label>${control}`;
    grid.appendChild(item);
  });
  container.appendChild(grid);
  return grid;
}

/* ---------- Generic dynamic add-list table (Surgical Hx, Family Hx, Study Procedures) ---------- */
function renderAddList(container, columns, seedOne){
  const wrap = document.createElement('div');
  const head = document.createElement('div');
  head.className='dyn-head';
  head.style.gridTemplateColumns = columns.map(()=>'1fr').join(' ')+' 32px';
  head.innerHTML = columns.map(c=>`<span>${c.label}</span>`).join('') + '<span></span>';
  const tableWrap = document.createElement('div'); tableWrap.className='table-wrap';
  tableWrap.appendChild(head);
  const rowsHost = document.createElement('div');
  tableWrap.appendChild(rowsHost);
  wrap.appendChild(tableWrap);
  const addBtn = document.createElement('button');
  addBtn.className='add-row-btn'; addBtn.textContent='+ Add row';
  wrap.appendChild(addBtn);
  container.appendChild(wrap);

  let counter=0;
  function addRow(){
    const id = counter++;
    const row = document.createElement('div');
    row.className='dyn-row'; row.style.gridTemplateColumns = columns.map(()=>'1fr').join(' ')+' 32px';
    row.innerHTML = columns.map(c=>{
      if(c.type==='select') return `<select>${['','...'].length?'':''}<option value="">–</option>${(c.options||[]).map(o=>`<option>${o}</option>`).join('')}</select>`;
      return `<input type="${c.type}" placeholder="${c.label}">`;
    }).join('') + `<button class="remove-btn">×</button>`;
    rowsHost.appendChild(row);
    row.querySelector('.remove-btn').addEventListener('click', ()=>row.remove());
  }
  addBtn.addEventListener('click', addRow);
  if(seedOne) addRow();
}

/* ============================================================
   FOLDER A — SCREENING & ENROLLMENT
   ============================================================ */

/* f1 Study Information */
{
  const b = makeSection('f1','Screening & Enrollment','Protocol and site-level identifiers for this visit record.');
  renderFieldGrid(b, [
    {id:'siProtocol', label:'Protocol number', type:'text', placeholder:'DCT-HF-501', readonly:true},
    {id:'siSite', label:'Site number', type:'text', placeholder:'e.g. 108'},
    {id:'siInvestigator', label:'Principal Investigator', type:'text'},
    {id:'siSubject', label:'Subject ID', type:'text', placeholder:'HF-0142', readonly:true},
    {id:'siVisitDate', label:'Visit date', type:'date'},
    {id:'siVisitType', label:'Visit type', type:'select', options:['Remote','Site']},
  ]);
  document.getElementById('siProtocol').value='DCT-HF-501';
  document.getElementById('siSubject').value='HF-0142';
}

/* f2 Informed Consent */
{
  const b = makeSection('f2','Screening & Enrollment','Documents that consent was obtained prior to any study procedure.');
  renderFieldGrid(b, [

  {key:'na',label:'Sodium',unit:'mmol/L',min:135,max:145,hardMin:125,hardMax:150},
];
function buildRangeGrid(container, configs, prefix, showTag, fixedTag, formId){
  const grid = document.createElement('div'); grid.className='vitals-grid';
  container.appendChild(grid);
  configs.forEach(v=>{
    const cell=document.createElement('div'); cell.className='vital'; cell.id=prefix+'-'+v.key;
    cell.innerHTML = `<div class="vital-top"><span class="vital-label">${v.label}</span>
      ${showTag?`<span class="tag tag-manual" id="tag-${prefix}-${v.key}">Manual</span>`:`<span class="tag tag-manual">${fixedTag}</span>`}</div>
      <input type="number" step="0.1" id="input-${prefix}-${v.key}" placeholder="—">
      <div class="vital-unit">${v.unit} · normal ${v.min}–${v.max}</div>
      <div class="query-flag" id="flag-${prefix}-${v.key}"></div>`;
    grid.appendChild(cell);
    document.getElementById(`input-${prefix}-${v.key}`).addEventListener('input', ()=>{
      if(showTag){ const tag=document.getElementById(`tag-${prefix}-${v.key}`); tag.textContent='Manual'; tag.className='tag tag-manual'; }
      evaluateRangeField(v, prefix, formId);
    });
  });
  return grid;
}
function evaluateRangeField(v, prefix, formId){
  const input=document.getElementById(`input-${prefix}-${v.key}`);
  const cell=document.getElementById(`${prefix}-${v.key}`);
  const flag=document.getElementById(`flag-${prefix}-${v.key}`);
  const val=parseFloat(input.value); const qid=`${prefix}-${v.key}`;
  if(isNaN(val)){ cell.classList.remove('has-query'); delete openQueries[qid]; renderQueryLog(); return; }
  if(val<v.hardMin || val>v.hardMax){
    if(!openQueries[qid]) logEvent(`Query opened — ${v.label} ${val} ${v.unit}`);
    cell.classList.add('has-query');
    const dir = val>v.hardMax?'above':'below';
    flag.textContent = `Query — ${v.label.toLowerCase()} (${val} ${v.unit}) is ${dir} the acceptable range (${v.hardMin}–${v.hardMax} ${v.unit}).`;
    openQueries[qid]={message:`${v.label}: ${val} ${v.unit} — outside acceptable range`, formId};
  } else {
    if(openQueries[qid]) logEvent(`Query resolved — ${v.label}`);
    cell.classList.remove('has-query'); delete openQueries[qid];
  }
  renderQueryLog();
}

function updateEligibilityGate(){
  const inclOk = INCLUSION.every((_,i)=>document.getElementById('incl-'+i)?.checked);
  const exclOk = EXCLUSION.every((_,i)=>!document.getElementById('excl-'+i)?.checked);
  const eligible = inclOk && exclOk;
  const btn = document.getElementById('randBtn');
  const msg = document.getElementById('randGateMsg');
  const exclNote = document.getElementById('exclNote');
  if(exclNote) exclNote.classList.toggle('show', !exclOk);
  if(btn){
    btn.disabled = !eligible || btn.dataset.locked==='true';
    if(msg) msg.textContent = eligible ? 'Eligibility confirmed — subject may be randomized.' : 'Confirm eligibility (Forms 5 & 6) to unlock randomization.';
  }
}

  const b = makeSection('f18','Treatment & Visit Forms','Compliance is calculated live from dispensed vs. returned units.');

    {id:'daDispensed', label:'Units dispensed', type:'number'},
    {id:'daReturned', label:'Units returned', type:'number'},

  ]);
  const note = document.createElement('div'); note.className='inline-note'; note.id='daNote';
  grid.appendChild(note);
  function checkCompliance(){
    const disp=parseFloat(document.getElementById('daDispensed').value);
    const ret=parseFloat(document.getElementById('daReturned').value);
    const exp=parseFloat(document.getElementById('daExpected').value);
    const qid='drug-accountability';
    if(isNaN(disp)||isNaN(ret)||isNaN(exp)||exp===0){ note.classList.remove('show'); delete openQueries[qid]; renderQueryLog(); return; }
    const taken = disp - ret;
    const pct = Math.round((taken/exp)*100);
    if(pct<80 || pct>120){
      if(!openQueries[qid]) logEvent(`Query opened — compliance ${pct}%`);
      note.className='inline-note show';
      note.textContent = `Query — calculated compliance is ${pct}% (expected 80–120%). Review with subject.`;
      openQueries[qid]={message:`Drug accountability compliance ${pct}% — outside 80–120% range`, formId:'f18'};
    } else {
      if(openQueries[qid]) logEvent('Query resolved — compliance within range');
      note.className='inline-note info show';
      note.textContent = `Calculated compliance: ${pct}% — within range.`;
      delete openQueries[qid];

    {id:'aeSerious', label:'Serious event?', type:'select', options:['No','Yes']},

  ]);
  const note=document.createElement('div'); note.className='inline-note'; note.id='aeQueryNote';
  note.textContent='Query — serious, related event has no documented action taken.';
  grid.appendChild(note);
  function checkAeLogic(){
    const serious=document.getElementById('aeSerious').value==='Yes';
    const causality=document.getElementById('aeCausality').value;
    const related=causality==='Related'||causality==='Possibly related';
    const noAction=['','None'].includes(document.getElementById('aeAction').value);
    const qid='ae-action';
    window.__aeReported = document.getElementById('aeTerm').value.trim()!=='';
    if(serious && related && noAction && causality!==''){
      if(!openQueries[qid]) logEvent('Query opened — serious related AE has no action taken');
      document.getElementById('item-aeAction').classList.add('query'); note.classList.add('show');
      openQueries[qid]={message:'Serious, related AE has no documented action taken', formId:'f24'};
    } else {
      if(openQueries[qid]) logEvent('Query resolved — AE action documented');
      document.getElementById('item-aeAction').classList.remove('query'); note.classList.remove('show');
      delete openQueries[qid];
    }
    renderQueryLog(); if(window.renderSafetySummary) window.renderSafetySummary();
  }
  ['aeSerious','aeCausality','aeAction','aeTerm'].forEach(id=>document.getElementById(id).addEventListener('input', checkAeLogic));

    <button class="sign-btn" id="signBtn">Sign &amp; lock visit</button>`;
  b.appendChild(sigRow);
  const banner=document.createElement('div'); banner.className='sign-banner'; banner.id='signBanner'; b.appendChild(banner);
  const auditToggle=document.createElement('button'); auditToggle.className='audit-toggle'; auditToggle.id='auditToggle'; auditToggle.textContent='Show audit trail';
  b.appendChild(auditToggle);
  const auditList=document.createElement('div'); auditList.className='audit-list'; auditList.id='auditList'; auditList.style.display='none'; b.appendChild(auditList);

  auditToggle.addEventListener('click', ()=>{
    const showing = auditList.style.display!=='none';
    auditList.style.display = showing?'none':'flex';
    auditToggle.textContent = showing?'Show audit trail':'Hide audit trail';
  });

  document.getElementById('signBtn').addEventListener('click', ()=>{
    const inclOk = INCLUSION.every((_,i)=>document.getElementById('incl-'+i)?.checked);
    const exclOk = EXCLUSION.every((_,i)=>!document.getElementById('excl-'+i)?.checked);
    const openCount = Object.keys(openQueries).length;
    const name=document.getElementById('sigName').value.trim();
    const role=document.getElementById('sigRole').value;
    if(!name||!role){ banner.className='sign-banner blocked'; banner.textContent='Enter investigator name and role before signing.'; return; }
    if(openCount>0 || !inclOk || !exclOk){
      const parts=[];
      if(openCount>0) parts.push(`${openCount} open quer${openCount>1?'ies':'y'} across the binder`);
      if(!inclOk) parts.push('unconfirmed inclusion criteria');
      if(!exclOk) parts.push('unresolved exclusion criteria');

  });
}

/* ============================================================
   QUERY LOG / STATUS / PROGRESS ENGINE
   ============================================================ */
function renderQueryLog(){
  const list=document.getElementById('queryList'); if(!list) return;
  const count=document.getElementById('queryCount'); const empty=document.getElementById('emptyNote');
  const keys=Object.keys(openQueries);
  count.textContent=keys.length+' open';
  list.innerHTML='';
  if(keys.length===0){ empty.style.display='block'; } else {
    empty.style.display='none';
    keys.forEach(k=>{
      const row=document.createElement('div'); row.className='query-row';
      row.innerHTML = `<span class="qtag">${k}</span><span>${openQueries[k].message}</span>`;
      list.appendChild(row);
    });
  }
  recomputeStatuses();
}
function recomputeStatuses(){
  document.querySelectorAll('.form-section').forEach(sec=>{
    const fid=sec.id.replace('form-','');
    const hasQuery = Object.values(openQueries).some(q=>q.formId===fid);
    let hasData=false;
    sec.querySelectorAll('input,select,textarea').forEach(el=>{
      if(el.offsetParent===null && !el.closest('.reveal.open') && el.closest('.reveal')) return;
      if(el.type==='checkbox'||el.type==='radio'){ if(el.checked) hasData=true; }
      else if(el.value && el.value.trim()!=='' ) hasData=true;
    });
    const dot=document.querySelector(`.nav-dot[data-target="form-${fid}"]`);
    if(dot) dot.className='nav-dot '+(hasQuery?'dot-coral':hasData?'dot-teal':'dot-grey');
  });
  const total=document.querySelectorAll('.form-section').length;
  const started=[...document.querySelectorAll('.form-section')].filter(sec=>
    [...sec.querySelectorAll('input,select,textarea')].some(el=>(el.type==='checkbox'||el.type==='radio')?el.checked:(el.value&&el.value.trim()!==''))
  ).length;
  const qc=Object.keys(openQueries).length;
  document.getElementById('summaryBar').innerHTML = `<b>${started}/${total}</b> forms started · <span class="q-count">${qc} open quer${qc===1?'y':'ies'}</span>`;
  if(window.renderVisitAssessments) window.renderVisitAssessments();
  if(window.renderSafetySummary) window.renderSafetySummary();
}

/* ---------- Pill toggles (generic, applies to all reveal sections) ---------- */
document.addEventListener('click', e=>{
  const btn = e.target.closest('.pill-toggle .pill');
  if(!btn) return;
  const toggle = btn.closest('.pill-toggle');
  const target = document.getElementById(toggle.dataset.reveal);
  toggle.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  if(target) target.classList.toggle('open', btn.dataset.val==='yes');
});

/* ---------- Global change listeners for progress/status ---------- */
document.querySelector('main.content').addEventListener('input', recomputeStatuses);
document.querySelector('main.content').addEventListener('change', recomputeStatuses);
document.querySelector('main.content').addEventListener('click', ()=>setTimeout(recomputeStatuses,0));

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const openCount=Object.keys(openQueries).length;
  document.getElementById('footerNote').innerHTML = openCount>0
    ? `Saved — <b style="color:var(--coral)">${openCount} query${openCount>1?'ies':''} open</b>`
    : `Saved — no open queries`;
  logEvent('Form saved as draft');
});
